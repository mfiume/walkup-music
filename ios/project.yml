name: BloordaleWalkup
options:
  bundleIdPrefix: com.bloordale
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BloordaleWalkup:
    type: application
    platform: iOS
    # Everything under BloordaleWalkup is scanned; xcodegen auto-classifies:
    #   .swift -> Sources phase
    #   roster.json, Assets.xcassets, Audio folder -> Resources phase
    # We use `type: folder` on the Audio directory so its subfolders
    # (Announcements / Library / TeamIntro) are preserved at runtime, which
    # is what RosterLoader.bundleURL(forResource:) expects.
    sources:
      - path: BloordaleWalkup/Sources
      - path: BloordaleWalkup/Supporting
      - path: BloordaleWalkup/Resources/roster.json
        buildPhase: resources
      - path: BloordaleWalkup/Resources/Assets.xcassets
        buildPhase: resources
      - path: BloordaleWalkup/Resources/Audio
        type: folder
        buildPhase: resources
    info:
      path: BloordaleWalkup/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Bloordale
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bloordale.walkup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIRequiresFullScreen: NO
    entitlements:
      path: BloordaleWalkup/Supporting/BloordaleWalkup.entitlements
      properties: {}
