name: Sync Suno playlist

# Keeps the Music tab in step with the Suno playlist. Songs added (or removed)
# in Suno are mirrored into audio/suno/ + suno-playlist.json and committed to
# `simple`, which is the branch GitHub Pages serves this site from — so the
# push *is* the deploy. No local run needed.

on:
  schedule:
    - cron: '0 11 * * *'     # daily, 11:00 UTC (7am ET / 6am EST)
  workflow_dispatch:          # "Run workflow" right after adding a song

permissions:
  contents: write

concurrency:
  group: sync-suno
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple

      - name: Mirror the playlist
        run: python3 scripts/sync_suno_playlist.py

      - name: Commit any changes
        run: |
          if git diff --quiet -- suno-playlist.json audio/suno; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suno-playlist.json audio/suno
          git commit -m "Sync Suno playlist"
          git push origin HEAD:simple
