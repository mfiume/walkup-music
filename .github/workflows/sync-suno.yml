name: Sync Suno playlist

# Keeps the Music tab in step with the Suno playlist. Songs added (or removed)
# in Suno are mirrored into audio/suno/ + suno-playlist.json and committed to
# `simple`, which is the branch GitHub Pages serves this site from — so the
# push *is* the deploy. No local run needed.

on:
  schedule:
    # Every 2 hours. A run that finds nothing new costs one API call and makes
    # no commit, so the only cost of the tighter cadence is CI minutes.
    - cron: '0 */2 * * *'
  workflow_dispatch:          # "Run workflow" to pick up a song immediately

permissions:
  contents: write

concurrency:
  group: sync-suno
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple
          # Runners ship git-lfs. Audio in this repo is plain binary on purpose
          # (Pages can't serve LFS — see .gitattributes), so keep LFS out of the
          # way entirely rather than let it rewrite tracks into pointer files.
          lfs: false

      - name: Mirror the playlist
        run: python3 scripts/sync_suno_playlist.py

      # A track that got turned into an LFS pointer still looks like a normal
      # file to `git diff`, and Pages would serve the pointer text as the song.
      # Fail loudly here rather than deploy silence to the ball field.
      - name: Reject LFS pointers
        run: |
          bad=0
          for f in audio/suno/*.mp3; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 100000 ] || head -c 40 "$f" | grep -q 'git-lfs.github.com'; then
              echo "::error file=$f::$f is $size bytes — looks like an LFS pointer, not audio"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Commit any changes
        run: |
          if git diff --quiet -- suno-playlist.json audio/suno; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suno-playlist.json audio/suno
          git commit -m "Sync Suno playlist"
          git push origin HEAD:simple
